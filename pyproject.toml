[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pydantic-canary"
version = "0.1.0"
description = "Detect Pydantic behavior changes across Python environments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Pydantic Canary contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
pydantic-canary = "pydantic_canary.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_canary"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
