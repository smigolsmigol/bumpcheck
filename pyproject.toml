[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bumpcheck"
dynamic = ["version"]
description = "Catch Pydantic runtime behavior changes before dependency bumps"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Federico Benini" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Repository = "https://github.com/smigolsmigol/bumpcheck"
Issues = "https://github.com/smigolsmigol/bumpcheck/issues"

[project.scripts]
bumpcheck = "bumpcheck.cli:main"
pydantic-canary = "bumpcheck.cli:main"

[tool.hatch.version]
path = "src/bumpcheck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bumpcheck"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
relative_files = true
source = ["src/bumpcheck"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
