[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pydantic-canary"
dynamic = ["version"]
description = "Detect Pydantic behavior changes across Python environments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Pydantic Canary contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Repository = "https://github.com/smigolsmigol/pydantic-canary"
Issues = "https://github.com/smigolsmigol/pydantic-canary/issues"

[project.scripts]
pydantic-canary = "pydantic_canary.cli:main"

[tool.hatch.version]
path = "src/pydantic_canary/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_canary"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
relative_files = true
source = ["src/pydantic_canary"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
